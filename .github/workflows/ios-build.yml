name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        # GitHub's macOS 15 runners have had runtime-registration issues when
        # switching back to Xcode 16.2. Prefer Xcode 16.4 when available,
        # otherwise stay on the image default instead of forcing 16.2.
        run: |
          if [ -d /Applications/Xcode_16.4.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          else
            echo "Xcode 16.4 not found; using the runner default Xcode"
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fix expo-notifications for SDK compatibility
        # With Xcode 16.4 (iOS 18.5 SDK) the #available(iOS 26.0, *) block compiles fine.
        # With Xcode 16.2 (iOS 18.2 SDK) it does not — patch it to a safe default.
        # This script is a no-op when the pattern is already absent.
        run: |
          python3 - <<'EOF'
          import pathlib, re
          f = pathlib.Path("node_modules/expo-notifications/ios/ExpoNotifications/Notifications/DateComponentsSerializer.swift")
          text = f.read_text()
          patched = re.sub(
            r'\s*if #available\(iOS 26\.0, \*\) \{\s*serializedComponents\["isRepeatedDay"\] = dateComponents\.isRepeatedDay \?\? false\s*\}\s*',
            '\n    serializedComponents["isRepeatedDay"] = false\n',
            text
          )
          if patched != text:
            f.write_text(patched)
            print("Patched DateComponentsSerializer.swift (removed iOS 26.0 availability guard)")
          else:
            print("DateComponentsSerializer.swift — no patch needed")
          EOF

      - name: Remove expo-dev-client before prebuild
        # expo-dev-client pulls in expo-dev-launcher whose Assets.xcassets
        # fails to compile with Xcode 16 in Release mode.
        # It is a dev-only tool and must not be included in production builds.
        run: |
          npm uninstall --no-save expo-dev-client
          rm -rf node_modules/expo-dev-launcher node_modules/expo-dev-menu node_modules/expo-dev-client

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS app (no codesign)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Mavrixfy.xcworkspace \
            -scheme Mavrixfy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            IBTOOL_WARNINGS_AS_ERRORS=NO \
            build \
            2>&1 | tee build.log | xcpretty --color --simple || \
            (
              echo "=== BUILD FAILED — ERRORS FROM RAW LOG ==="
              grep -E "error:|warning: .*(error|failed)" build.log | head -60 || true
              echo ""
              echo "=== STORYBOARD / IBTOOL ERRORS ==="
              grep -i "ibtool\|storyboard\|CompileStoryboard" build.log | head -40 || true
              echo ""
              echo "=== LAST 80 LINES ==="
              tail -80 build.log
              exit 1
            )

      - name: Create Payload directory
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: mkdir Payload

      - name: Move app to Payload
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: mv Mavrixfy.app Payload/

      - name: Zip output
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: zip -qq -r -9 MavrixfyIpaExport.ipa Payload

      - name: Rename IPA for direct download
        run: |
          cp ios/build/Build/Products/Release-iphoneos/MavrixfyIpaExport.ipa ./Mavrixfy.ipa
          ls -lh Mavrixfy.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mavrixfy-iOS-IPA
          path: ./Mavrixfy.ipa
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build.log

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: iOS Build v${{ github.run_number }}
          body: |
            iOS IPA Build - Unsigned (No Code Signing)

            **Build Details:**
            - Build Number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: ./Mavrixfy.ipa
