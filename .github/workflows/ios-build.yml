name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode & SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Patch Podfile — strip dev-only pods for Release
        working-directory: ios
        run: |
          # expo-dev-launcher's Assets.xcassets fails to compile with Xcode 16+
          # in Release mode. These pods are only needed for development builds.
          python3 - <<'EOF'
          import pathlib
          pf = pathlib.Path("Podfile")
          text = pf.read_text()
          dev_pods = [
            "expo-dev-launcher",
            "expo-dev-menu",
            "expo-dev-client",
            "EXDevLauncher",
            "EXDevMenu",
          ]
          lines = text.splitlines(keepends=True)
          filtered = [l for l in lines if not any(p in l for p in dev_pods)]
          pf.write_text("".join(filtered))
          removed = len(lines) - len(filtered)
          print(f"Patched Podfile: removed {removed} dev-pod line(s)")
          EOF

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS app (no codesign)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Mavrixfy.xcworkspace \
            -scheme Mavrixfy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            build \
            2>&1 | tee build.log | xcpretty --color --simple || \
            (echo "--- LAST 100 LINES OF RAW LOG ---" && tail -100 build.log && exit 1)

      - name: Create Payload directory
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: mkdir Payload

      - name: Move app to Payload
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: mv Mavrixfy.app Payload/

      - name: Zip output
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: zip -qq -r -9 MavrixfyIpaExport.ipa Payload

      - name: Rename IPA for direct download
        run: |
          cp ios/build/Build/Products/Release-iphoneos/MavrixfyIpaExport.ipa ./Mavrixfy.ipa
          ls -lh Mavrixfy.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mavrixfy-iOS-IPA
          path: ./Mavrixfy.ipa
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build.log

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: iOS Build v${{ github.run_number }}
          body: |
            iOS IPA Build - Unsigned (No Code Signing)

            **Build Details:**
            - Build Number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: ./Mavrixfy.ipa
