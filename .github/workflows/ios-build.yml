name: iOS IPA Build (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 iOS Build (No Code Signing)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node ──────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'          # caches ~/.npm across runs

      - name: Install dependencies
        run: npm ci

      - name: Record native toolchain
        id: toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # ── Expo prebuild ─────────────────────────────────────────────────────
      # Regenerate the project every time; never restore old JS bundles,
      # Pods integration or app products through an overlapping ios/ cache.
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean --no-install

      # ── Ruby / Bundler ────────────────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      # ── CocoaPods cache ───────────────────────────────────────────────────
      # Key uses package-lock.json + plugins (same inputs that determine pods).
      # Podfile.lock doesn't exist yet at cache-restore time (it's generated by
      # pod install), so we can't use it as a cache key here. Instead we derive
      # the key from the inputs that cause pods to change. restore-keys allow
      # partial hits so even a stale Pods/ dir avoids most downloads.
      - name: Cache CocoaPods global cache
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: cocoapods-global-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ hashFiles('package-lock.json','plugins/**','app.config.js','app.json') }}
          restore-keys: |
            cocoapods-global-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-

      - name: Cache ios/Pods directory
        id: cache-pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: cocoapods-pods-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('package-lock.json','plugins/**','app.config.js','app.json') }}
          restore-keys: |
            cocoapods-pods-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ steps.toolchain.outputs.xcode }}-

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then gem install cocoapods --no-document; fi
          pod --version
          cd ios
          # Reintegrate Pods even on cache hits: prebuild created a new project.
          pod install --repo-update 2>&1 | tee pod-install.log

      # ── SPM (Swift Package Manager) cache ────────────────────────────────
      # YouTubeKit is fetched from GitHub every build (~15s). Cache it.
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ios/build/SourcePackages
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('plugins/**','package-lock.json') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ steps.toolchain.outputs.xcode }}-

      # Cache compiler modules, not products/intermediates that can carry an
      # old bundled JS release or a generated project from another commit.
      - name: Cache Xcode compiler modules
        uses: actions/cache@v4
        with:
          path: ios/build/ModuleCache.noindex
          key: xcode-modules-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('ios/Podfile.lock','package-lock.json','plugins/**') }}
          restore-keys: |
            xcode-modules-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ steps.toolchain.outputs.xcode }}-

      # ── Xcode build ───────────────────────────────────────────────────────
      - name: Build iOS app (no codesign)
        run: |
          cd ios
          echo "🔨 Starting xcodebuild..."
          set -euo pipefail
          if xcodebuild -workspace Mavrixfy.xcworkspace \
            -scheme Mavrixfy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build-result.xcresult \
            -destination 'generic/platform=iOS' \
            -parallelizeTargets \
            -jobs $(sysctl -n hw.logicalcpu) \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build.log; then
            echo "✅ Unsigned build completed!"
          else
            build_status=$?
            echo "❌ Build failed (exit $build_status)"
            tail -n 200 build.log
            exit "$build_status"
          fi

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios/build.log
            ios/pod-install.log
            ios/build-result.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Create IPA
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/ios/build/Build/Products/Release-iphoneos/Mavrixfy.app"
          test -d "$app_path"
          plutil -lint "$app_path/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")
          test -f "$app_path/$executable"
          lipo -verify_arch arm64 "$app_path/$executable"
          staging="$RUNNER_TEMP/mavrixfy-unsigned-ipa"
          mkdir -p "$staging/Payload"
          ditto "$app_path" "$staging/Payload/Mavrixfy.app"
          cd "$staging"
          zip -q -r "$GITHUB_WORKSPACE/Mavrixfy.ipa" Payload
          unzip -tq "$GITHUB_WORKSPACE/Mavrixfy.ipa"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 Mavrixfy.ipa > Mavrixfy.ipa.sha256
          echo "Unsigned arm64 IPA packaged. Re-sign before installing on an iPhone." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mavrixfy-iOS-IPA-Unsigned
          path: |
            Mavrixfy.ipa
            Mavrixfy.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          tag_name: ios-v${{ github.run_number }}
          name: iOS Build v${{ github.run_number }} (Unsigned)
          body: |
            # 📱 iOS IPA Build - Unsigned (No Code Signing)

            ⚠️ **This IPA is NOT signed and cannot be installed directly on un-jailbroken devices without Sideloadly/AltStore.**

            ## 🔧 Installation Methods

            ### Method 1: Sideloadly (Recommended)
            1. Download [Sideloadly](https://sideloadly.io/)
            2. Download the IPA file below
            3. Connect your iPhone/iPad via USB
            4. Use your Apple ID (free account works)
            5. Drag IPA into Sideloadly and install

            ### Method 2: AltStore
            1. Install [AltStore](https://altstore.io/)
            2. Download the IPA and open in AltStore

            Free-account installations normally expire after 7 days and require re-signing/refreshing.
            See https://sideloadly.io/faq for current requirements and supported capabilities.
            This unsigned device build cannot be installed by simply dragging its .app into Xcode.

            ## 📋 Build Details
            - **Build Number:** `${{ github.run_number }}`
            - **Commit:** `${{ github.sha }}`
            - **SDK:** iphoneos (iOS Device)
            - **Configuration:** Release
            - **Signing:** Unsigned

            ---
            Built automatically using GitHub Actions ✨
          draft: false
          prerelease: false
          files: |
            Mavrixfy.ipa
            Mavrixfy.ipa.sha256
          make_latest: true
