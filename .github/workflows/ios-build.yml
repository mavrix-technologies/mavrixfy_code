name: iOS IPA Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        type: choice
        default: ios-ipa
        options:
          - ios-ipa
          - production
      wait_for_build:
        description: Wait for EAS to finish and upload the IPA as a GitHub artifact
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-ipa-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Trigger iOS EAS build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Start EAS iOS build
        id: eas-build
        shell: bash
        env:
          EAS_PROFILE: ${{ inputs.profile }}
          WAIT_FOR_BUILD: ${{ inputs.wait_for_build }}
        run: |
          set -euo pipefail

          if [ "$WAIT_FOR_BUILD" = "true" ]; then
            eas build --platform ios --profile "$EAS_PROFILE" --non-interactive --wait --json > eas-build-result.json
            node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('eas-build-result.json', 'utf8').trim();
          const parsed = JSON.parse(raw);
          const builds = Array.isArray(parsed) ? parsed : Array.isArray(parsed.builds) ? parsed.builds : [parsed];
          const build = builds.find(Boolean);
          const artifactUrl =
            build?.artifacts?.buildUrl ||
            build?.artifacts?.applicationArchiveUrl ||
            build?.buildUrl;
          const dashboardUrl = build?.buildDetailsPageUrl || build?.url || '';

          if (!artifactUrl) {
            throw new Error('EAS build finished but no IPA artifact URL was returned.');
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_url=${artifactUrl}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dashboard_url=${dashboardUrl}\n`);
          NODE
          else
            eas build --platform ios --profile "$EAS_PROFILE" --non-interactive --no-wait
          fi

      - name: Download IPA artifact
        if: ${{ inputs.wait_for_build }}
        run: |
          curl --fail --location "${{ steps.eas-build.outputs.artifact_url }}" --output Mavrixfy.ipa
          ls -lh Mavrixfy.ipa

      - name: Upload IPA artifact
        if: ${{ inputs.wait_for_build }}
        uses: actions/upload-artifact@v4
        with:
          name: Mavrixfy-iOS-IPA
          path: Mavrixfy.ipa
          compression-level: 0
          retention-days: 14
