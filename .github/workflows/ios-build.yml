name: iOS Simulator Build (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-ios-simulator:
    name: 🎉 iOS Simulator Build
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build iOS Simulator app
        run: |
          cd ios
          xcodebuild \
            -workspace Mavrixfy.xcworkspace \
            -scheme Mavrixfy \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA from Simulator app
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          
          # Verify the app exists
          if [ ! -d "Mavrixfy.app" ]; then
            echo "❌ Mavrixfy.app not found!"
            ls -la
            exit 1
          fi
          
          echo "✅ Found Mavrixfy.app"
          
          # Create Payload directory (IPA structure)
          mkdir -p Payload
          
          # Copy app into Payload
          cp -r Mavrixfy.app Payload/
          
          # Create IPA (zip file with Payload folder)
          zip -r -q -9 Mavrixfy-Simulator.ipa Payload
          
          # Move to workspace root
          mv Mavrixfy-Simulator.ipa ${{ github.workspace }}/
          
          echo "✅ IPA created successfully!"
          ls -lh ${{ github.workspace }}/Mavrixfy-Simulator.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mavrixfy-iOS-Simulator-IPA
          path: Mavrixfy-Simulator.ipa
          compression-level: 0
          retention-days: 14

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          tag_name: ios-simulator-v${{ github.run_number }}
          name: iOS Simulator Build v${{ github.run_number }}
          body: |
            # 📱 iOS Simulator IPA (Unsigned)

            ⚠️ **This IPA is for iOS Simulator ONLY**
            - Cannot be installed on physical devices
            - Works on macOS with Xcode/iOS Simulator
            - No code signing required

            📋 **Installation Instructions:**
            
            **Method 1: Extract and Drag (Easiest)**
            ```bash
            # Unzip the IPA
            unzip Mavrixfy-Simulator.ipa
            
            # Open iOS Simulator, then drag Mavrixfy.app onto it
            ```
            
            **Method 2: Command Line**
            ```bash
            # Unzip the IPA
            unzip Mavrixfy-Simulator.ipa
            
            # Install on booted simulator
            xcrun simctl install booted Payload/Mavrixfy.app
            ```
            
            **Method 3: Sideloadly (Windows/Mac)**
            - Open Sideloadly
            - Select iOS Simulator as target
            - Drag the IPA file
            - Install

            🔧 **Build Details:**
            - Build Number: `${{ github.run_number }}`
            - Commit: `${{ github.sha }}`
            - SDK: iOS Simulator (iphonesimulator)
            - Configuration: Release
            - Format: IPA (standard iOS app package)
            
            ---
            Built automatically using GitHub Actions ✨
          draft: false
          prerelease: false
          files: Mavrixfy-Simulator.ipa
          make_latest: true
