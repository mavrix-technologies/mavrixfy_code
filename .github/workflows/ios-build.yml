name: iOS IPA Build (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 iOS Build (No Code Signing)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Patch Podfile for XCode compatibility (if needed)
        run: |
          cd ios
          # Check XCode version
          xcodebuild -version
          # Remove strict XCode version check if present
          if grep -q "React Native requires XCode" Podfile; then
            echo "Patching Podfile to remove XCode version requirement..."
            sed -i.bak '/React Native requires XCode/,/raise.*XCode/d' Podfile
            echo "Podfile patched successfully"
          else
            echo "No XCode version check found in Podfile"
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: List available schemes
        run: |
          cd ios
          echo "📋 Listing available schemes..."
          xcodebuild -list -workspace Mavrixfy.xcworkspace
          echo ""
          echo "🔍 Xcode version:"
          xcodebuild -version
          echo ""
          echo "📱 Available SDKs:"
          xcodebuild -showsdks

      - name: Build iOS archive (unsigned)
        run: |
          cd ios
          echo "🔨 Creating unsigned archive..."
          xcodebuild archive \
            -workspace Mavrixfy.xcworkspace \
            -scheme Mavrixfy \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "${{ github.workspace }}/Mavrixfy.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Verify archive was created
        run: |
          if [ -d "${{ github.workspace }}/Mavrixfy.xcarchive" ]; then
            echo "✅ Archive created successfully"
            echo "📂 Archive contents:"
            ls -la "${{ github.workspace }}/Mavrixfy.xcarchive/Products/"
          else
            echo "❌ Archive was not created"
            exit 1
          fi

      - name: Create IPA from archive
        run: |
          echo "📦 Creating IPA package..."
          cd "${{ github.workspace }}/Mavrixfy.xcarchive/Products"
          
          # Verify the Applications folder exists
          if [ ! -d "Applications" ]; then
            echo "❌ Applications folder not found in archive"
            echo "📂 Current directory contents:"
            ls -la
            exit 1
          fi
          
          # Rename Applications to Payload
          mv Applications Payload
          
          # Verify the app exists in Payload
          if [ ! -d "Payload/Mavrixfy.app" ]; then
            echo "❌ Mavrixfy.app not found in Payload"
            echo "📂 Payload contents:"
            ls -la Payload/
            exit 1
          fi
          
          echo "✅ Found Mavrixfy.app in Payload"
          
          # Create IPA by zipping the Payload folder
          zip -r -q "${{ github.workspace }}/Mavrixfy.ipa" Payload
          
          echo "✅ IPA created successfully!"
          ls -lh "${{ github.workspace }}/Mavrixfy.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mavrixfy-iOS-IPA-Unsigned
          path: Mavrixfy.ipa
          compression-level: 0
          retention-days: 14

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          tag_name: ios-unsigned-v${{ github.run_number }}
          name: iOS Unsigned Build v${{ github.run_number }}
          body: |
            # 📱 iOS IPA Build - Unsigned (No Code Signing)

            ⚠️ **Installation Instructions:**
            This IPA is **NOT signed** and requires one of these tools to install:
            - **Sideloadly** (Windows/Mac)
            - **AltStore** (Free, with 7-day expiry)
            - **AltServer** (Self-hosted)
            - **TrollStore** (Jailbroken devices)

            📋 **Build Details:**
            - Build Number: `${{ github.run_number }}`
            - Commit: `${{ github.sha }}`
            - Workflow: `${{ github.workflow }}`
            - Triggered by: `${{ github.event_name }}`
            
            🔧 **Technical Info:**
            - Bundle ID: `com.mavrixfy.app`
            - Configuration: Release (Unsigned)
            - No Apple Developer Account Required
            
            ---
            Built automatically using GitHub Actions ✨
          draft: false
          prerelease: false
          files: Mavrixfy.ipa
          make_latest: true
