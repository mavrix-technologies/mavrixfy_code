name: iOS Build (Unsigned IPA / Simulator)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'device = unsigned iPhone IPA; simulator = simulator .app'
        type: choice
        default: device
        options:
          - device
          - simulator
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.target || 'device' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build-ios:
    name: iOS ${{ inputs.target || 'device' }} (Release, no signing)
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      BUILD_TARGET: ${{ inputs.target || 'device' }}
      COCOAPODS_DISABLE_STATS: 'true'
      # Keep the compiler stable for compatible native caches.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Record native toolchain
        id: toolchain
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          version=$(xcodebuild -version)
          echo "$version"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(echo "$version" | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "dependencies=${{ hashFiles('package-lock.json','plugins/**','modules/**/*.podspec','modules/**/package.json','modules/**/expo-module.config.json','patches/**','app.config.js','app.json') }}" >> "$GITHUB_OUTPUT"

      - name: Test native playback
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            modules/mavrixfy-playback/ios/PlaybackCommandValues.swift \
            scripts/ios-playback-command-values.test.swift \
            -o "$RUNNER_TEMP/ios-playback-command-tests"
          "$RUNNER_TEMP/ios-playback-command-tests"

          xcrun swiftc \
            -parse-as-library \
            modules/mavrixfy-playback/ios/PlaybackTimeline.swift \
            scripts/ios-playback-timeline.test.swift \
            -o "$RUNNER_TEMP/ios-playback-timeline-tests"
          "$RUNNER_TEMP/ios-playback-timeline-tests"

      # Generate fresh native configuration before restoring build caches.
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Cache CocoaPods global cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: cocoapods-global-v3-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ steps.toolchain.outputs.dependencies }}
          restore-keys: |
            cocoapods-global-v3-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-

      - name: Cache ios/Pods directory
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: cocoapods-pods-v3-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ steps.toolchain.outputs.dependencies }}
          restore-keys: |
            cocoapods-pods-v3-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ steps.toolchain.outputs.xcode }}-

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then gem install cocoapods --no-document; fi
          pod --version
          cd ios
          # Reintegrate Pods even on cache hits: prebuild created a new project.
          pod install 2>&1 | tee pod-install.log

      # ExpoModulesJSI products live outside the app's DerivedData.
      - name: Cache ExpoModulesJSI products
        uses: actions/cache@v4
        with:
          path: node_modules/expo-modules-jsi/apple/Products
          key: expo-jsi-v2-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('package-lock.json','patches/**','ios/Podfile.lock') }}

      - name: Restore incremental Xcode build cache
        uses: irgaly/xcode-cache@282e57619a58eb57a2374be91df1798d46703bfd # v1
        with:
          deriveddata-directory: ios/build
          sourcepackages-directory: ios/SourcePackages
          # Reuse compatible objects; changed sources rebuild through Xcode.
          key: xcode-incremental-v4-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ env.BUILD_TARGET }}-${{ steps.toolchain.outputs.dependencies }}-${{ hashFiles('ios/Podfile.lock') }}-${{ github.sha }}
          restore-keys: |
            xcode-incremental-v4-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ env.BUILD_TARGET }}-${{ steps.toolchain.outputs.dependencies }}-${{ hashFiles('ios/Podfile.lock') }}-
          swiftpm-cache-key: xcode-spm-v2-${{ runner.os }}-${{ steps.toolchain.outputs.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('plugins/**','package-lock.json') }}
          use-default-mtime-targets: true
          restore-mtime-targets: |
            ios/**/*.pbxproj
            ios/**/*.xcconfig
            ios/**/*.xcfilelist

      # xcodebuild resolves Swift packages as part of the build.
      - name: Build iOS app (no codesign)
        run: |
          cd ios
          set -euo pipefail
          case "$BUILD_TARGET" in
            device) sdk=iphoneos; destination='generic/platform=iOS'; architecture=arm64 ;;
            simulator) sdk=iphonesimulator; destination='generic/platform=iOS Simulator'; architecture=$(uname -m) ;;
            *) echo "Unsupported build target: $BUILD_TARGET"; exit 1 ;;
          esac
          xcodebuild -workspace Mavrixfy.xcworkspace \
            -scheme Mavrixfy \
            -configuration Release \
            -sdk "$sdk" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/ios/SourcePackages" \
            -resultBundlePath build-result.xcresult \
            -destination "$destination" \
            -showBuildTimingSummary \
            -parallelizeTargets \
            -jobs $(sysctl -n hw.logicalcpu) \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS="$architecture" \
            build 2>&1 | tee build.log

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.BUILD_TARGET }}
          path: |
            ios/build.log
            ios/pod-install.log
            node_modules/expo-modules-jsi/apple/.DerivedData/Logs/Build
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failed Xcode result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-failure-${{ env.BUILD_TARGET }}
          path: ios/build-result.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Create IPA
        if: env.BUILD_TARGET == 'device'
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/ios/build/Build/Products/Release-iphoneos/Mavrixfy.app"
          test -d "$app_path"
          plutil -lint "$app_path/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")
          test -f "$app_path/$executable"
          # lipo's -verify_arch consumes all following arguments as architectures.
          # The executable must come before that operation.
          xcrun lipo "$app_path/$executable" -verify_arch arm64
          staging="$RUNNER_TEMP/mavrixfy-unsigned-ipa"
          mkdir -p "$staging/Payload"
          ditto "$app_path" "$staging/Payload/Mavrixfy.app"
          cd "$staging"
          zip -q -r "$GITHUB_WORKSPACE/Mavrixfy.ipa" Payload
          unzip -tq "$GITHUB_WORKSPACE/Mavrixfy.ipa"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 Mavrixfy.ipa > Mavrixfy.ipa.sha256
          echo "Unsigned arm64 IPA packaged. Re-sign before installing on an iPhone." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        if: env.BUILD_TARGET == 'device'
        uses: actions/upload-artifact@v4
        with:
          name: Mavrixfy-iOS-IPA-Unsigned
          path: |
            Mavrixfy.ipa
            Mavrixfy.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Package simulator app
        if: env.BUILD_TARGET == 'simulator'
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/ios/build/Build/Products/Release-iphonesimulator/Mavrixfy.app"
          test -d "$app_path"
          plutil -lint "$app_path/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")
          xcrun lipo "$app_path/$executable" -verify_arch "$(uname -m)"
          tar -czf "$GITHUB_WORKSPACE/Mavrixfy-simulator.tar.gz" -C "$(dirname "$app_path")" Mavrixfy.app
          shasum -a 256 "$GITHUB_WORKSPACE/Mavrixfy-simulator.tar.gz" > "$GITHUB_WORKSPACE/Mavrixfy-simulator.tar.gz.sha256"
          echo 'Simulator Release .app packaged for the runner architecture; install with xcrun simctl on a matching Mac simulator.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload simulator artifact
        if: env.BUILD_TARGET == 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: Mavrixfy-iOS-Simulator
          path: |
            Mavrixfy-simulator.tar.gz
            Mavrixfy-simulator.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: env.BUILD_TARGET == 'device'
        with:
          tag_name: ios-v${{ github.run_number }}
          name: iOS Build v${{ github.run_number }} (Unsigned)
          body: |
            Unsigned arm64 iPhone IPA, Release configuration.
            Re-sign with a valid provisioning profile before installing.
            Sideloading tools: [Sideloadly](https://sideloadly.io/) / [AltStore](https://altstore.io/).
            Commit: `${{ github.sha }}`
            Verify the download using the attached SHA-256 checksum.
          files: |
            Mavrixfy.ipa
            Mavrixfy.ipa.sha256
          make_latest: true
