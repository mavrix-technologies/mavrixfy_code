name: iOS IPA Build (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 iOS Build (No Code Signing)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Strip signing from Xcode project and entitlements
        run: |
          cd ios
          # Switch to manual signing, clear team and identities in pbxproj
          sed -i.bak 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Mavrixfy.xcodeproj/project.pbxproj
          sed -i.bak 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' Mavrixfy.xcodeproj/project.pbxproj
          sed -i.bak 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' Mavrixfy.xcodeproj/project.pbxproj
          sed -i.bak 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' Mavrixfy.xcodeproj/project.pbxproj
          # Empty the entitlements file to remove capabilities that force signing
          ENTITLEMENTS_FILE=$(find . -name "*.entitlements" | head -1)
          if [ -n "$ENTITLEMENTS_FILE" ]; then
            echo "Found entitlements: $ENTITLEMENTS_FILE — emptying it"
            cat > "$ENTITLEMENTS_FILE" << 'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          ENTEOF
          fi

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Archive iOS app (unsigned)
        run: |
          cd ios
          xcodebuild archive \
            -workspace Mavrixfy.xcworkspace \
            -scheme Mavrixfy \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/Mavrixfy.xcarchive \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA from archive
        run: |
          mkdir -p Payload
          cp -R "ios/build/Mavrixfy.xcarchive/Products/Applications/Mavrixfy.app" Payload/
          zip -qq -r -9 Mavrixfy.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mavrixfy-iOS-IPA-Unsigned
          path: Mavrixfy.ipa
          compression-level: 0
          retention-days: 14

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ios-v${{ github.run_number }}
          name: iOS Build v${{ github.run_number }} (Unsigned)
          body: |
            iOS IPA Build - Unsigned (No Code Signing)
            
            ⚠️ This IPA is NOT signed and cannot be installed directly on un-jailbroken devices without Sideloadly/AltStore.
            Built automatically without any Apple Developer Account.
            
            **Build Details:**
            - Build Number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: Mavrixfy.ipa
