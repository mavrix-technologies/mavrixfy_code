name: iOS IPA Build (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 iOS Build (No Code Signing)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Patch Podfile for XCode compatibility (if needed)
        run: |
          cd ios
          # Check XCode version
          xcodebuild -version
          
          # Remove strict XCode version check if present
          if grep -q "React Native requires XCode" Podfile; then
            echo "Patching Podfile to remove XCode version requirement..."
            sed -i.bak '/React Native requires XCode/,/raise.*XCode/d' Podfile
            echo "Podfile patched successfully"
          else
            echo "No XCode version check found in Podfile"
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build iOS app (no codesign)
        run: |
          cd ios
          xcodebuild -workspace Mavrixfy.xcworkspace \
            -scheme Mavrixfy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Create IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          mv Mavrixfy.app Payload/
          zip -qq -r -9 Mavrixfy.ipa Payload
          mv Mavrixfy.ipa ${{ github.workspace }}/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mavrixfy-iOS-IPA-Unsigned
          path: Mavrixfy.ipa
          compression-level: 0
          retention-days: 14

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          tag_name: ios-v${{ github.run_number }}
          name: iOS Build v${{ github.run_number }} (Unsigned)
          body: |
            # 📱 iOS IPA Build - Unsigned (No Code Signing)

            ⚠️ **This IPA is NOT signed and cannot be installed directly on un-jailbroken devices without Sideloadly/AltStore.**

            Built automatically without any Apple Developer Account.

            ## 🔧 Installation Methods

            ### Method 1: Sideloadly (Recommended)
            1. Download [Sideloadly](https://sideloadly.io/)
            2. Download the IPA file below
            3. Connect your iPhone/iPad via USB
            4. Use your Apple ID (free account works)
            5. Drag IPA into Sideloadly and install

            ### Method 2: AltStore
            1. Install [AltStore](https://altstore.io/)
            2. Download the IPA file
            3. Open in AltStore to install

            ### Method 3: Xcode (Mac only)
            1. Unzip the IPA
            2. Open Xcode → Window → Devices and Simulators
            3. Select your device
            4. Drag the .app file into the "Installed Apps" section

            ## 📋 Build Details
            - **Build Number:** `${{ github.run_number }}`
            - **Commit:** `${{ github.sha }}`
            - **SDK:** iphoneos (iOS Device)
            - **Configuration:** Release
            - **Signing:** Unsigned (use sideloading tools)
            
            ---
            Built automatically using GitHub Actions ✨
          draft: false
          prerelease: false
          files: Mavrixfy.ipa
          make_latest: true
