name: iOS IPA Build (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 iOS Build (No Code Signing)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node ──────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'          # caches ~/.npm across runs

      - name: Install dependencies
        run: npm ci

      # ── Expo prebuild ─────────────────────────────────────────────────────
      # Cache the generated ios/ directory keyed on files that affect it.
      # On a cache hit we skip prebuild entirely (saves ~2-3 min).
      - name: Cache Expo prebuild output
        id: cache-prebuild
        uses: actions/cache@v4
        with:
          path: ios
          key: expo-prebuild-${{ runner.os }}-${{ hashFiles('app.config.js','app.json','package-lock.json','plugins/**') }}
          restore-keys: |
            expo-prebuild-${{ runner.os }}-

      - name: Prebuild iOS
        if: steps.cache-prebuild.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --clean

      - name: Patch Podfile for XCode compatibility
        run: |
          cd ios
          xcodebuild -version
          if grep -q "React Native requires XCode" Podfile 2>/dev/null; then
            echo "Patching Podfile..."
            sed -i.bak '/React Native requires XCode/,/raise.*XCode/d' Podfile
          fi

      # ── Ruby / Bundler ────────────────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true   # caches gem bundle automatically
          working-directory: ios

      # ── CocoaPods cache ───────────────────────────────────────────────────
      # Cache both the global pod cache AND the ios/Pods/ folder.
      # Key includes Podfile.lock so cache busts on any pod version change.
      - name: Cache CocoaPods global cache
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: cocoapods-global-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-global-${{ runner.os }}-

      - name: Cache ios/Pods directory
        id: cache-pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: cocoapods-pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-pods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        if: steps.cache-pods.outputs.cache-hit != 'true'
        run: |
          cd ios
          pod install --repo-update

      # ── Xcode DerivedData cache ───────────────────────────────────────────
      # Caches compiled object files — biggest single win for repeat builds.
      # Key includes source hash so stale cache is never used for wrong code.
      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ios/build
          key: xcode-derived-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock','ios/**/*.swift','ios/**/*.m','ios/**/*.h') }}
          restore-keys: |
            xcode-derived-${{ runner.os }}-

      # ── Xcode build ───────────────────────────────────────────────────────
      - name: Build iOS app (no codesign)
        run: |
          cd ios
          echo "🔨 Starting xcodebuild..."
          set -o pipefail
          xcodebuild -workspace Mavrixfy.xcworkspace \
            -scheme Mavrixfy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            -parallelizeTargets \
            -jobs $(sysctl -n hw.logicalcpu) \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build.log

          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed (exit $BUILD_EXIT_CODE)"
            tail -200 build.log
            exit $BUILD_EXIT_CODE
          fi
          echo "✅ Build completed!"

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ios/build.log
          retention-days: 7

      - name: Create IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          mv Mavrixfy.app Payload/
          zip -qq -r -9 Mavrixfy.ipa Payload
          mv Mavrixfy.ipa ${{ github.workspace }}/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mavrixfy-iOS-IPA-Unsigned
          path: Mavrixfy.ipa
          compression-level: 0
          retention-days: 14

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          tag_name: ios-v${{ github.run_number }}
          name: iOS Build v${{ github.run_number }} (Unsigned)
          body: |
            # 📱 iOS IPA Build - Unsigned (No Code Signing)

            ⚠️ **This IPA is NOT signed and cannot be installed directly on un-jailbroken devices without Sideloadly/AltStore.**

            ## 🔧 Installation Methods

            ### Method 1: Sideloadly (Recommended)
            1. Download [Sideloadly](https://sideloadly.io/)
            2. Download the IPA file below
            3. Connect your iPhone/iPad via USB
            4. Use your Apple ID (free account works)
            5. Drag IPA into Sideloadly and install

            ### Method 2: AltStore
            1. Install [AltStore](https://altstore.io/)
            2. Download the IPA and open in AltStore

            ### Method 3: Xcode (Mac only)
            1. Unzip the IPA
            2. Xcode → Window → Devices and Simulators
            3. Drag .app file to Installed Apps

            ## 📋 Build Details
            - **Build Number:** `${{ github.run_number }}`
            - **Commit:** `${{ github.sha }}`
            - **SDK:** iphoneos (iOS Device)
            - **Configuration:** Release
            - **Signing:** Unsigned

            ---
            Built automatically using GitHub Actions ✨
          draft: false
          prerelease: false
          files: Mavrixfy.ipa
          make_latest: true
