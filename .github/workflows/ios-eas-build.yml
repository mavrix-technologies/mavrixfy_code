name: iOS-EAS-Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🍎 iOS EAS Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply trusted local patches
        run: npx patch-package

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup production environment
        run: |
          echo "Copying .env.production to .env for production build"
          cp .env.production .env
          echo "Production environment configured"

      - name: Build iOS (Simulator - No Apple Account Required)
        run: eas build --platform ios --profile ios-simulator --non-interactive --no-wait

      - name: Build iOS (Optimized Production - Smaller Size)
        run: eas build --platform ios --profile ios-optimized --non-interactive --no-wait
        continue-on-error: true

      - name: Build iOS (Standard Production - Requires Apple Developer Account)
        run: eas build --platform ios --profile production --non-interactive --no-wait
        continue-on-error: true
